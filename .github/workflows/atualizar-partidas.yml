name: Atualizar partidas

# Coleta diária das partidas no Chess.com (API pública, sem autenticação) de
# cada jogador de config.json,
# retrata o mês corrente, analisa com Stockfish (binário oficial, versão fixada) as partidas ainda não
# analisadas (mais novas primeiro, com orçamento de tempo — o que faltar fica
# para a próxima execução), regenera docs/dados/ e commita só se algo mudou.
# O GitHub Pages (branch main, pasta /docs) republica sozinho a cada push.
#
# Horário: 09:17 UTC (06:17 em Brasília) — de madrugada no Brasil, depois das
# partidas da noite; o minuto quebrado evita o pico de jobs agendados em :00.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      completo:
        description: 'Rebaixar todo o histórico (--completo)'
        type: boolean
        default: false
      orcamento:
        description: 'Minutos de análise com Stockfish (repartidos entre os jogadores)'
        type: number
        default: 45
      usuario:
        description: 'Só esta conta do Chess.com (vazio = todos do config.json)'
        type: string
        default: ''
      medir:
        description: 'Só medir custo × qualidade destes esforços (ex.: d12,250000,1000000); não analisa nem commita'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: atualizar-partidas
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Binário oficial, versão e hash fixados: a análise só muda quando a gente
      # troca a versão aqui (o apt do Ubuntu fica anos atrás e muda sozinho).
      - name: Baixar Stockfish
        env:
          SF_TAG: sf_19
          SF_SHA256: 9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f
        run: |
          curl -fsSL -o sf.tar.gz "https://github.com/official-stockfish/Stockfish/releases/download/$SF_TAG/stockfish-linux-x86-64-universal.tar.gz"
          echo "$SF_SHA256  sf.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sf" && tar -xzf sf.tar.gz -C "$RUNNER_TEMP/sf" && rm sf.tar.gz
          BIN=$(find "$RUNNER_TEMP/sf" -type f -name 'stockfish*' ! -name '*.*' -perm -u+x | head -1)
          echo "STOCKFISH_PATH=$BIN" >> "$GITHUB_ENV"
          "$BIN" <<< 'quit' | head -1

      - name: Medir esforço do motor
        if: inputs.medir != ''
        run: python -m src.analise.medir --nos "${{ inputs.medir }}"

      - name: Rodar pipeline
        if: inputs.medir == ''
        run: |
          ARGS="--analisar --orcamento-min ${{ inputs.orcamento || 45 }}"
          if [ "${{ inputs.completo }}" = "true" ]; then ARGS="$ARGS --completo"; fi
          if [ -n "${{ inputs.usuario }}" ]; then ARGS="$ARGS --usuario ${{ inputs.usuario }}"; fi
          python run_pipeline.py $ARGS

      - name: Commitar se algo mudou
        if: inputs.medir == ''
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A dados docs
          if git diff --cached --quiet; then
            echo 'Nenhuma partida nova; nada a commitar.'
            exit 0
          fi
          git commit -m "Atualiza partidas em $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Se alguém commitou código durante a execução, rebaseia antes de enviar
          # (os arquivos gerados só são escritos por este workflow).
          for tentativa in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || exit 1
          done
          exit 1
