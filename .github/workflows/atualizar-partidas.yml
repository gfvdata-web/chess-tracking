name: Atualizar partidas

# Coleta diária das partidas no Chess.com (API pública, sem autenticação) de
# cada jogador de config.json,
# retrata o mês corrente, analisa com Stockfish as partidas ainda não
# analisadas (mais novas primeiro, com orçamento de tempo — o que faltar fica
# para a próxima execução), regenera docs/dados/ e commita só se algo mudou.
# O GitHub Pages (branch main, pasta /docs) republica sozinho a cada push.
#
# Horário: 09:17 UTC (06:17 em Brasília) — de madrugada no Brasil, depois das
# partidas da noite; o minuto quebrado evita o pico de jobs agendados em :00.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      completo:
        description: 'Rebaixar todo o histórico (--completo)'
        type: boolean
        default: false
      orcamento:
        description: 'Minutos de análise com Stockfish (repartidos entre os jogadores)'
        type: number
        default: 45
      usuario:
        description: 'Só esta conta do Chess.com (vazio = todos do config.json)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: atualizar-partidas
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq stockfish
          /usr/games/stockfish <<< 'quit' | head -1

      - name: Rodar pipeline
        env:
          STOCKFISH_PATH: /usr/games/stockfish
        run: |
          ARGS="--analisar --orcamento-min ${{ inputs.orcamento || 45 }}"
          if [ "${{ inputs.completo }}" = "true" ]; then ARGS="$ARGS --completo"; fi
          if [ -n "${{ inputs.usuario }}" ]; then ARGS="$ARGS --usuario ${{ inputs.usuario }}"; fi
          python run_pipeline.py $ARGS

      - name: Commitar se algo mudou
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A dados docs
          if git diff --cached --quiet; then
            echo 'Nenhuma partida nova; nada a commitar.'
            exit 0
          fi
          git commit -m "Atualiza partidas em $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Se alguém commitou código durante a execução, rebaseia antes de enviar
          # (os arquivos gerados só são escritos por este workflow).
          for tentativa in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || exit 1
          done
          exit 1
